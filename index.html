<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#064C72">
<meta name="format-detection" content="telephone=no">
<title>音ガチャ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&family=Kiwi+Maru:wght@300;400;500&family=Courier+Prime:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: a record slides out of its sleeve and spins (hero), then a sleeve back cover lists the song; single-theme 70s retro look by choice */
:root {
  --navy: #064c72;
  --teal: #026c80;
  --sage: #8db4ad;
  --red: #e9311a;
  --orange: #ed6335;
  --yellow: #f8b31a;
  --paper: #f6ede6;
  --vinyl: #0f2433;
  --ink: #064c72;
  --line: rgba(141,180,173,.4);
  /* 日本語はすべてKiwi Maru（太さは300・400・500の3つ） */
  --f-jp: "Kiwi Maru", "Hiragino Maru Gothic ProN";
  /* 番号・曲名・アーティスト・サービス名：英字はCourier Prime */
  --f-display: "Courier Prime", var(--f-jp), monospace;
  /* 小さめのラベル類 */
  --f-body: "Noto Sans", var(--f-jp), sans-serif;
  --f-mono: var(--f-body);
  /* ひとことmemo・選んだひと */
  --f-round: var(--f-jp), sans-serif;
  /* 最下部の一文 */
  --f-foot: var(--f-round);
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background-color: var(--navy);
  color: var(--paper);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
.wrap {
  max-width: 420px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 36px;
  min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center; gap: 22px;
}
.brand {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .24em;
  text-transform: uppercase; color: var(--sage);
  display: flex; gap: 10px; align-items: center; justify-content: center;
}
.brand::before, .brand::after { content: ""; width: 28px; height: 1px; background: var(--line); }

/* ── hero: sleeve + record ── */
.deck { position: relative; width: 100%; aspect-ratio: 100 / 61; }
.sleeve {
  position: absolute; left: 0; top: 0; width: 61%; aspect-ratio: 1; z-index: 2;
  background: var(--teal); border-radius: 6px;
  box-shadow: 0 10px 24px rgba(0,0,0,.25);
  overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 14px 14px 0;
}
.sleeve .label-top { font-family: var(--f-mono); font-size: 10px; letter-spacing: .2em; color: var(--sage); }
.sleeve .big { font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 15vw, 62px); line-height: .9; color: var(--paper); font-variant-numeric: tabular-nums; }
.sleeve .big small { display: block; font-family: var(--f-display); font-size: 11px; letter-spacing: .2em; color: var(--yellow); margin-bottom: 6px; }
.stripes { margin: 0 -14px; display: grid; }
.stripes span { height: 14px; }
.stripes span:nth-child(1) { background: var(--red); }
.stripes span:nth-child(2) { background: var(--orange); }
.stripes span:nth-child(3) { background: var(--yellow); }

.record {
  position: absolute; top: 3%; left: 3%; width: 58%; aspect-ratio: 1; z-index: 1;
  animation: slide 1s .3s cubic-bezier(.25,.9,.3,1) forwards;
  border-radius: 50%; overflow: hidden; /* keep the spinning box from widening the page */
  box-shadow: 0 8px 20px rgba(0,0,0,.3);
}
@keyframes slide { to { left: 41%; } }
.disc {
  width: 100%; height: 100%; border-radius: 50%;
  background:
    radial-gradient(circle, transparent 0 33%, rgba(255,255,255,.05) 33.5%, transparent 34%),
    repeating-radial-gradient(circle, var(--vinyl) 0 2px, #16303f 2.5px 3px),
    var(--vinyl);
  position: relative;
  animation: spin 1.8s linear infinite; /* 33⅓ rpm = 1.8 s per turn */
}
.disc::after { /* sheen */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 30deg, transparent 0 10%, rgba(255,255,255,.08) 14%, transparent 20% 60%, rgba(255,255,255,.06) 64%, transparent 70%);
}
.center {
  position: absolute; inset: 31%; border-radius: 50%;
  background: var(--paper);
  box-shadow: inset 0 0 0 4px var(--red), inset 0 0 0 7px var(--paper), inset 0 0 0 9px var(--orange);
  display: grid; place-items: center; text-align: center; color: var(--ink);
}
.center .lno { font-family: var(--f-display); font-weight: 700; font-size: clamp(13px, 4vw, 17px); line-height: 1; position: absolute; top: 19%; left: 0; right: 0; }
.center .rpm { position: absolute; bottom: 20%; left: 0; right: 0; font-family: var(--f-mono); font-size: 7px; letter-spacing: .14em; color: var(--teal); }
.center .hole { position: absolute; left: 50%; top: 50%; width: 7%; aspect-ratio: 1; border-radius: 50%; background: var(--navy); transform: translate(-50%,-50%); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── back cover ── */
.back {
  background: var(--paper); color: var(--ink);
  border-radius: 6px;
  padding: 18px 20px 20px;
  display: flex; flex-direction: column; gap: 12px;
  animation: rise .6s .9s cubic-bezier(.2,.9,.3,1.1) both;
}
@keyframes rise { from { transform: translateY(24px); opacity: .0; } to { transform: none; opacity: 1; } }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.side { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; color: var(--teal); }
.side b { color: var(--red); font-weight: 500; }
.tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--teal); color: var(--paper); white-space: nowrap; }
.rule { border-top: 2px solid var(--ink); margin: 0; }
.rule.thin { border-top-width: 1px; opacity: .25; }

.track { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: baseline; }
.track .pos { font-family: var(--f-mono); font-size: 13px; color: var(--red); }
.title { font-family: var(--f-display); font-weight: 500; font-size: clamp(30px, 10vw, 42px); line-height: 1.08; margin: 0; white-space: nowrap; min-width: 0; }
.title.small { font-size: clamp(24px, 7.6vw, 32px); line-height: 1.15; }
.artist { grid-column: 2; font-family: var(--f-display); font-weight: 500; font-size: 15px; margin: 4px 0 0; }
.meta { grid-column: 2; font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--teal); margin: 0; font-variant-numeric: tabular-nums; }
.memo { margin: 0; font-family: var(--f-round); padding: 12px 14px; border-radius: 6px; background: rgba(248,179,26,.2); font-size: 14px; line-height: 1.75; }
.memo .by, .by-solo { display: flex; justify-content: flex-end; align-items: baseline; gap: 8px; margin-top: 6px; font-weight: 300; font-size: 14px; font-family: var(--f-round); }
.by em { font-style: normal; font-family: var(--f-round); font-weight: 400; font-size: 11px; letter-spacing: .08em; color: var(--teal); }
.by-solo { margin: 0; }
.memo small { display: block; font-family: var(--f-round); font-size: 11px; letter-spacing: .08em; color: var(--teal); margin-bottom: 2px; }

.svc-label { font-family: var(--f-mono); font-size: 10px; letter-spacing: .16em; color: var(--teal); margin: 4px 0 -4px; }
.services { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.svc {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  min-height: 52px; padding: 12px 14px; border-radius: 6px; text-decoration: none;
  background: var(--teal); color: var(--paper); font-family: var(--f-display); font-weight: 500; font-size: 13px; line-height: 1.3;
  transition: transform .15s ease;
}
.svc:active { transform: scale(.97); background: var(--navy); }
.svc:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.svc i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 0 2px var(--paper); }

.foot { font-family: var(--f-foot); font-size: 13px; color: var(--sage); text-align: center; margin: 0; }

.empty { text-align: center; display: grid; gap: 10px; padding-block: 24px; }
.empty h1 { font-family: var(--f-round); font-weight: 700; font-size: 24px; margin: 0; }
.empty p { color: var(--sage); margin: 0; }

/* ── 自分の1曲を作るページ ── */
.make-link { font-family: var(--f-round); font-size: 12px; text-align: center; margin: -10px 0 0; }
.make-link a { color: var(--yellow); text-underline-offset: 3px; }
.contact { font-family: var(--f-round); font-size: 12px; text-align: center; color: var(--sage); margin: -10px 0 0; }
.contact a { color: var(--yellow); text-underline-offset: 3px; }
.contact a:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.maker { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.maker h1 { font-family: var(--f-round); font-weight: 700; font-size: 20px; margin: 0; }
.maker .lead { font-family: var(--f-round); font-size: 13px; line-height: 1.8; margin: 0; }
.maker fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; }
.maker legend { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; color: var(--teal); padding: 0; margin-bottom: 8px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-family: var(--f-round); font-size: 12px; color: var(--teal); }
.field label b { color: var(--red); font-weight: 500; margin-left: 4px; }
.field input, .field textarea {
  width: 100%; min-width: 0; font: inherit; font-family: var(--f-round); font-size: 16px; color: var(--ink);
  background: #fffaf6; border: 1.5px solid rgba(6,76,114,.25); border-radius: 6px; padding: 9px 11px;
}
.field textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
.field input:focus-visible, .field textarea:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; border-color: var(--teal); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hint { font-family: var(--f-round); font-size: 11px; color: var(--teal); margin: 0; min-height: 1em; }
.btn2 {
  appearance: none; border: 0; cursor: pointer; font-family: var(--f-round); font-weight: 700; font-size: 14px;
  background: var(--teal); color: var(--paper); border-radius: 6px; padding: 11px 14px; min-height: 44px; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn2.ghost { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); }
.btn2:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.btn2:disabled { opacity: .45; cursor: default; }
.result { background: rgba(248,179,26,.2); border-radius: 6px; padding: 14px; display: grid; gap: 10px; }
.result .url { font-family: var(--f-mono); font-size: 12px; word-break: break-all; background: #fffaf6; border-radius: 4px; padding: 8px 10px; margin: 0; user-select: all; }
.result .meter { font-family: var(--f-round); font-size: 12px; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { font-family: var(--f-mono); font-size: 11px; padding: 2px 9px; border-radius: 99px; background: var(--teal); color: var(--paper); }
.pill.warn { background: var(--orange); }
.pill.bad { background: var(--red); }
.result .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.side-block { display: grid; gap: 12px; padding-top: 14px; border-top: 2px solid var(--ink); }
.side-block h2 { font-family: var(--f-mono); font-weight: 500; font-size: 13px; letter-spacing: .16em; color: var(--red); margin: 0; }
.panel { display: grid; gap: 14px; }
.modes { display: flex; flex-wrap: wrap; gap: 6px; }
.mode { position: relative; }
.mode input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.mode span { display: inline-block; font-family: var(--f-round); font-size: 13px; padding: 7px 14px; border-radius: 99px; border: 1.5px solid var(--teal); color: var(--teal); }
.mode input:checked + span { background: var(--teal); color: var(--paper); }
.mode input:focus-visible + span { outline: 3px solid var(--yellow); outline-offset: 2px; }
.flip { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(141,180,173,.18); padding: 4px; border-radius: 99px; margin-bottom: 18px; }
.flip-btn { appearance: none; border: 0; cursor: pointer; font-family: var(--f-mono); font-size: 12px; letter-spacing: .16em; padding: 9px 0; border-radius: 99px; background: transparent; color: var(--sage); }
.flip-btn[aria-selected="true"] { background: var(--paper); color: var(--ink); }
.flip-btn:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.search-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.search-row input { width: 100%; min-width: 0; font-family: var(--f-round); font-size: 16px; color: var(--ink); background: #fffaf6; border: 1.5px solid rgba(6,76,114,.25); border-radius: 6px; padding: 9px 11px; min-height: 44px; }
.search-row input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; border-color: var(--teal); }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 360px; overflow-y: auto; }
.result { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; cursor: pointer;
  background: #fffaf6; border: 1.5px solid rgba(6,76,114,.18); border-radius: 6px; padding: 6px; color: var(--ink); font: inherit; }
.result:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }
.result img, .result .noart { width: 44px; height: 44px; border-radius: 4px; background: var(--sage); object-fit: cover; }
.result .rt { min-width: 0; display: grid; }
.result b { font-family: var(--f-round); font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result small { font-family: var(--f-round); font-size: 12px; color: var(--teal); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more-links { border: 1.5px dashed rgba(6,76,114,.3); border-radius: 6px; padding: 10px 12px; }
.more-links summary { cursor: pointer; font-family: var(--f-round); font-size: 13px; color: var(--teal); list-style: none; display: flex; align-items: center; gap: 6px; min-height: 28px; }
.more-links summary::-webkit-details-marker { display: none; }
.more-links summary::before { content: "＋"; font-size: 14px; }
.more-links[open] summary::before { content: "−"; }
.more-links summary:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; border-radius: 4px; }
.more-links fieldset { margin-top: 10px; }
.links { display: grid; gap: 8px; }
.link-row { display: grid; grid-template-columns: minmax(0, 8.6rem) minmax(0, 1fr) auto; gap: 6px; align-items: center; }
.link-row select, .link-row input {
  width: 100%; min-width: 0; font-family: var(--f-round); font-size: 16px; color: var(--ink);
  background: #fffaf6; border: 1.5px solid rgba(6,76,114,.25); border-radius: 6px; padding: 9px 8px; min-height: 44px;
}
.link-row select { font-size: 14px; }
.link-row select:focus-visible, .link-row input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; border-color: var(--teal); }
.link-row .rm { appearance: none; border: 0; background: none; color: var(--teal); font-size: 20px; width: 32px; height: 44px; cursor: pointer; }
.addlink { justify-self: start; appearance: none; border: 0; background: none; padding: 4px 0; cursor: pointer; font-family: var(--f-round); font-size: 13px; color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }
.acts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hint.err { color: var(--red); }
.hint a { color: var(--teal); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.again { display: block; margin: 16px auto 0; background: none; border: 0; cursor: pointer; font-family: var(--f-round); font-size: 13px; color: var(--yellow); text-decoration: underline; text-underline-offset: 3px; padding: 8px; }
.again:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.code-big { font-family: var(--f-mono); font-size: 44px; letter-spacing: .18em; text-align: center; margin: 4px 0; color: var(--red); font-variant-numeric: tabular-nums; user-select: all; }
.warn-note { font-family: var(--f-round); font-size: 13px; line-height: 1.8; text-align: center; margin: 0; padding: 10px; border-radius: 6px; background: rgba(233,49,26,.1); color: var(--red); }
.empty .btn2 { margin-top: 8px; }
.steps { font-family: var(--f-round); font-size: 12px; line-height: 1.8; margin: 0; padding-left: 1.3em; }

@media (prefers-reduced-motion: reduce) {
  .record { animation: none; left: 41%; }
  .disc, .back { animation: none; }
}
</style>
</head>

/* ── 自分の1曲：曲の情報をURLの ?r= に詰める ── */
const LINK_IDS = {
  apple:   { pack: u => (u.match(/[?&]i=(\d+)/) || u.match(/\/song\/(?:[^/]+\/)?(\d+)/) || [])[1], open: id => `https://music.apple.com/jp/song/${id}` },
  spotify: { pack: u => (u.match(/\/track\/([A-Za-z0-9]+)/) || [])[1], open: id => `https://open.spotify.com/track/${id}` },
  amazon:  { pack: u => (u.match(/\/tracks\/([A-Z0-9]+)/) || [])[1], open: id => `https://music.amazon.co.jp/tracks/${id}` },
  ytmusic: { pack: u => (u.match(/[?&]v=([\w-]+)/) || [])[1], open: id => `https://music.youtube.com/watch?v=${id}` },
  line:    { pack: u => (u.match(/lin\.ee\/(\w+)/) || [])[1], open: id => `https://lin.ee/${id}` },
  youtube: { pack: u => /(^|\.)youtube\.com\/watch|youtu\.be\//.test(u) ? (u.match(/[?&]v=([\w-]+)/) || u.match(/youtu\.be\/([\w-]+)/) || [])[1] : undefined, open: id => `https://youtu.be/${id}` }
};
const LINK_ORDER = ["apple", "spotify", "amazon", "ytmusic", "line", "youtube"];
const FIELD_ORDER = ["title", "artist", "year", "tag", "by", "memo"];
function packLink(kind, url) {
  url = (url || "").trim();
  if (!url) return "";
  const id = LINK_IDS[kind].pack(url);
  return id || url.replace(/^https?:\/\//, "~");
}
function openLink(kind, v) {
  if (!v) return "";
  return v[0] === "~" ? "https://" + v.slice(1) : LINK_IDS[kind].open(v);
}
function b64url(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64url(s) {
  const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function encodeSong(f) {
  const arr = [...FIELD_ORDER.map(k => (f[k] || "").trim()), ...LINK_ORDER.map(k => packLink(k, f[k]))];
  while (arr.length && !arr[arr.length - 1]) arr.pop();
  return b64url(JSON.stringify(arr));
}
function decodeSong(r) {
  const arr = JSON.parse(unb64url(r));
  if (!Array.isArray(arr) || !arr[0]) throw new Error("bad");
  const s = { links: {} };
  FIELD_ORDER.forEach((k, i) => { if (arr[i]) s[k] = String(arr[i]); });
  LINK_ORDER.forEach((k, i) => { const v = arr[FIELD_ORDER.length + i]; if (v) s.links[k] = openLink(k, String(v)); });
  return s;
}

/* ── どの面に何が入っているかをURLから読む ──
   A面: ?no=番号（おすすめ） または ?a=…（自分の曲）
   B面: ?bno=番号（おすすめ） または ?b=…（自分の曲）  ※ ?r=… は以前の形式（B面の自分の曲） */
function readSides(params) {
  const pick = key => {
    key = String(key).replace(/^0+(?=\d)/, "");
    const no = key.padStart(2, "0");
    return SONGS[key] ? { song: SONGS[key], no, kind: "pick" } : { missing: true, no };
  };
  const mine = r => { try { return { song: decodeSong(r), kind: "mine" }; } catch (e) { return { broken: true }; } };
  let A = null, B = null;
  if (params.get("no")) A = pick(params.get("no"));
  else if (params.get("a")) A = mine(params.get("a"));
  if (params.get("bno")) B = pick(params.get("bno"));
  else if (params.get("b")) B = mine(params.get("b"));
  else if (params.get("r")) B = mine(params.get("r"));
  if (!A && !B) A = pick(location.hash.slice(1) || "1");
  /* おすすめのキーホルダーにB面の曲があれば、B面を指定していないときはそれを入れる */
  if (A && A.kind === "pick" && A.song.b && !B) B = { song: A.song.b, no: A.no, kind: "pick" };
  if (B && B.kind === "pick" && B.song.b && !params.get("no") && !params.get("a")) { A = { song: B.song, no: B.no, kind: "pick" }; B = { song: B.song.b, no: B.no, kind: "pick" }; }
  return { A, B };
}
let currentSide = "A";
function render() {
  const params = new URLSearchParams(location.search);
  const out = document.getElementById("out");
  document.getElementById("makeLink").hidden = true;
  if (params.has("make") || location.hash === "#make") { renderMaker(out); return; }
  if (params.get("id")) { renderStore(out, params.get("id")); return; }
  renderSides(out, readSides(params));
}
/* A面・B面の表示（2曲あれば切り替えボタンを出す）。extra は下に足すHTML、after は描いたあとに呼ぶ */
function renderSides(out, sides, extra = "", after) {
  if (!sides[currentSide]) currentSide = sides.A ? "A" : "B";
  const both = sides.A && sides.B;
  const sw = both ? `
    <div class="flip" role="tablist" aria-label="面を選ぶ">
      ${["A", "B"].map(x => `<button type="button" role="tab" class="flip-btn" aria-selected="${x === currentSide}" data-side="${x}">SIDE ${x}</button>`).join("")}
    </div>` : "";
  out.innerHTML = sw + sideHTML(sides[currentSide], currentSide) + extra;
  out.querySelectorAll(".flip-btn").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.side === currentSide) return;
    currentSide = b.dataset.side; renderSides(out, sides, extra, after); fitTitle();
  }));
  if (after) after();
}
function sideHTML(x, side) {
  if (x.broken) return `<div class="empty"><h1>レコードが読み取れません</h1><p>URLが途中で切れているかもしれません。もう一度書き込んでみてください。</p></div>`;
  if (x.missing) return `<div class="empty"><h1>まだ何も録音されていません</h1><p>このキーホルダー（No.${esc(x.no)}）には、まだ曲が入っていません。</p></div>`;
  return x.kind === "pick"
    ? card(x.song, { side, deckNo: x.no, deckSmall: "No.", label: "No." + x.no, pos: side + "1" })
    : card(x.song, { side, deckNo: side, deckSmall: "SIDE", label: "MY RECORD", pos: side + "1", mine: true });
}

function card(s, o) {
  const q = encodeURIComponent(`${s.artist || ""} ${s.title.replace(/\n/g, " ")}`.trim());
  return `
    <div style="display:flex;flex-direction:column;gap:22px">
    ${deck(esc(o.deckNo), esc(o.deckSmall))}
    <article class="back">
      <div class="head">
        <span class="side">SIDE <b>${o.side}</b> · ${esc(o.label)}</span>
        ${s.tag ? `<span class="tag">${esc(s.tag)}</span>` : ""}
      </div>
      <hr class="rule">
      <div class="track">
        <span class="pos">${o.pos}</span>
        <h1 class="title${s.small ? " small" : ""}">${esc(s.title).replace(/\n/g, "<br>")}</h1>
        <p class="artist">${esc(s.artist)}</p>
        ${s.year ? `<p class="meta">RELEASED ${esc(s.year)}</p>` : ""}
      </div>
      ${s.memo ? `<div class="memo"><small>ひとことmemo</small>${esc(s.memo)}${s.by ? `<div class="by"><em>選んだひと</em>${esc(s.by)}</div>` : ""}</div>` : (s.by ? `<p class="by-solo by"><em>選んだひと</em>${esc(s.by)}</p>` : "")}
      <hr class="rule thin">
      <p class="svc-label">LISTEN ON</p>
      <div class="services">
        ${SERVICES.map(v => {
          const link = s.links && s.links[v.id];
          /* おすすめの曲のYouTubeはいつも検索。自分の曲でYouTubeのリンクがあれば、そこへ直接 */
          const direct = link && (!v.searchOnly || o.mine);
          const name = v.id === "youtube" && direct ? "YouTube" : v.name;
          return `<a class="svc" style="--c:${v.color}" href="${esc(direct ? link : v.search(q))}" rel="noopener"><i></i>${name}</a>`;
        }).join("")}
      </div>
    </article>
    </div>`;
}

/* ── 作成ページ ── */
const MAKER_FIELDS = [
  ["title", "曲名", true], ["artist", "アーティスト", true],
  ["year", "リリース年", false, "例：1999"], ["tag", "タグ", false, "例：ロック"],
  ["memo", "ひとことmemo", false, "この曲のどこが好き？", "textarea"], ["by", "選んだひと", false, "あなたの名前・ニックネーム"]
];
const MAKER_LINKS = [["apple", "Apple Music"], ["spotify", "Spotify"], ["amazon", "Amazon Music"], ["ytmusic", "YouTube Music"], ["line", "LINE MUSIC"], ["youtube", "YouTube"]];

/* ── 音楽サービスを選んでリンクを入れる欄 ── */
const LINK_PH = {
  apple: "https://music.apple.com/…", spotify: "https://open.spotify.com/…", amazon: "https://music.amazon.co.jp/…",
  ytmusic: "https://music.youtube.com/…", line: "https://lin.ee/…", youtube: "https://youtu.be/…"
};
const PREF_KEY = "otogacha-service";
/* Apple Musicはページから直接、Spotify・Amazon Music・YouTube・YouTube Musicは保存用プログラム経由で曲の情報を取る */
const FILLABLE = ["apple", "spotify", "amazon", "ytmusic", "youtube"];
function preferredService() {
  try { const v = localStorage.getItem(PREF_KEY); if (LINK_PH[v]) return v; } catch (e) {}
  return "apple";
}
let rowSeq = 0;
function addLinkRow(px, svc, url = "") {
  const box = document.getElementById(px + "-links");
  if (!box || box.children.length >= MAKER_LINKS.length) return;
  const used = [...box.querySelectorAll("select")].map(x => x.value);
  if (!svc) svc = (MAKER_LINKS.find(([k]) => !used.includes(k)) || MAKER_LINKS[0])[0];
  const n = ++rowSeq;
  const first = box.children.length === 0;
  const row = document.createElement("div");
  row.className = "link-row";
  row.innerHTML = `
    <select id="ln-s-${n}" aria-label="音楽サービス">${MAKER_LINKS.map(([k, name]) => `<option value="${k}" ${k === svc ? "selected" : ""}>${name}</option>`).join("")}</select>
    <input id="ln-u-${n}" type="url" inputmode="url" aria-label="曲のリンク" placeholder="${LINK_PH[svc]}">
    ${first ? `<span class="rm" aria-hidden="true"></span>` : `<button type="button" class="rm" aria-label="この行を消す">×</button>`}`;
  row.querySelector("input").value = url;
  box.appendChild(row);
  syncLinkUI(px);
}
function readLinks(px) {
  const out = {};
  document.querySelectorAll(`#${px}-links .link-row`).forEach(r => {
    const svc = r.querySelector("select").value, url = r.querySelector("input").value.trim();
    if (url) out[svc] = url;
  });
  return out;
}
function initLinks(px, links) {
  const box = document.getElementById(px + "-links");
  if (!box) return;
  box.innerHTML = "";
  const entries = Object.entries(links || {}).filter(([k, v]) => LINK_PH[k] && v);
  if (entries.length) entries.forEach(([k, v]) => addLinkRow(px, k, v));
  else addLinkRow(px, preferredService());
}
function syncLinkUI(px) {
  const box = document.getElementById(px + "-links");
  box.querySelectorAll(".link-row").forEach(r => { r.querySelector("input").placeholder = LINK_PH[r.querySelector("select").value]; });
  /* 曲名などを自動で入れられるサービスなら、そのサービス名のボタンを出す（いちばん上の行を優先） */
  const svc = [...box.querySelectorAll("select")].map(x => x.value).find(v => FILLABLE.includes(v));
  const fill = document.querySelector(`[data-fill="${px}"]`);
  if (fill) {
    fill.hidden = !svc;
    if (svc) { fill.dataset.svc = svc; fill.textContent = `${MAKER_LINKS.find(([k]) => k === svc)[1]}のリンクから曲名・アーティスト・年を入れる`; }
  }
  const add = document.getElementById(px + "-addlink");
  if (add) add.hidden = box.children.length >= MAKER_LINKS.length;
}
function wireLinks(update) {
  document.querySelectorAll(".side-block").forEach(sec => {
    const px = sec.dataset.px;
    if (!document.getElementById(px + "-links")) return;
    initLinks(px);
    document.getElementById(px + "-addlink").addEventListener("click", () => { addLinkRow(px); update(); });
    sec.addEventListener("change", e => {
      if (e.target.matches(".link-row select")) {
        syncLinkUI(px);
        if (e.target.closest(".link-row") === sec.querySelector(".link-row")) { try { localStorage.setItem(PREF_KEY, e.target.value); } catch (err) {} }
      }
    });
    sec.addEventListener("click", e => {
      if (e.target.matches(".link-row .rm")) { e.target.closest(".link-row").remove(); syncLinkUI(px); update(); }
    });
  });
}

      ${sideForm("b", "B", ["none", "mine", "pick"])}
      <div class="result" aria-live="polite">
        <p class="hint" id="m-empty">曲を入れると、ここにURLが出ます。</p>
        <div id="m-done" hidden style="display:grid;gap:10px">
          <p class="url" id="m-url"></p>
          <p class="meter" id="m-meter"></p>
          <div class="acts">
            <button type="button" class="btn2" id="m-copy">URLをコピー</button>
            <a class="btn2 ghost" id="m-preview" href="#" target="_blank" rel="noopener">表示を確かめる</a>
          </div>
          <ol class="steps">
            <li>「NFC Tools」アプリを開いて「書き込む」→「レコードを追加」→「URL / URI」を選ぶ</li>
            <li>コピーしたURLを貼り付けて「OK」→「書き込む」</li>
            <li>キーホルダーにスマホをかざす</li>
          </ol>
        </div>
      </div>
    </form>`;

  const $ = id => document.getElementById(id);
  const keys = [...MAKER_FIELDS.map(x => x[0]), ...MAKER_LINKS.map(x => x[0])];
  const mode = px => document.querySelector(`input[name="${px}-mode"]:checked`).value;

  function showPanels() {
    document.querySelectorAll(".side-block").forEach(sec => {
      const m = mode(sec.dataset.px);
      sec.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.mode !== m);
    });
  }
  /* 各面の値を「URLのパラメータ」にする。まだ足りなければ null */
  function sideParam(px) {
    const m = mode(px);
    if (m === "none") return "";
    if (m === "pick") {
      const raw = $(px + "-no").value.trim().replace(/^0+(?=\d)/, "");
      const hint = $(px + "-no-hint");
      if (!raw) { hint.textContent = "番号を入れてください。"; return null; }
      const song = SONGS[raw];
      if (!song) { hint.textContent = `No.${raw.padStart(2, "0")} は見つかりません。`; return null; }
      const t = x => `${x.title.replace(/\n/g, " ")} / ${x.artist}`;
      hint.textContent = `No.${raw.padStart(2, "0")}：${t(song)}` + (song.b ? `（B面：${t(song.b)}）` : "");
      return (px === "a" ? "no=" : "bno=") + raw;
    }
    const v = { ...Object.fromEntries(MAKER_FIELDS.map(([k]) => [k, $(px + "-" + k).value])), ...readLinks(px) };
    if (!v.title.trim() || !v.artist.trim()) return null;
    return (px === "a" ? "a=" : "b=") + encodeSong(v);
  }
  function update() {
    showPanels();
    const a = sideParam("a"), b = sideParam("b");
    const ok = a && b !== null;
    $("m-empty").hidden = !!ok;
    $("m-done").hidden = !ok;
    if (!ok) return;
    const url = location.origin + location.pathname + "?" + [a, b].filter(Boolean).join("&");
    $("m-url").textContent = url;
    $("m-preview").href = url;
    const len = new TextEncoder().encode(url.replace(/^https:\/\//, "")).length;
    let pill, note;
    if (len <= 130)      { pill = `<span class="pill">NTAG213 以上</span>`; note = "どのタグにも書き込めます。"; }
    else if (len <= 480) { pill = `<span class="pill warn">NTAG215 以上</span>`; note = "NTAG213には入りません。"; }
    else if (len <= 850) { pill = `<span class="pill warn">NTAG216</span>`; note = "NTAG216だけ書き込めます。"; }
    else                 { pill = `<span class="pill bad">長すぎます</span>`; note = "ひとことmemoを短くするか、リンクを減らしてください。"; }
    $("m-meter").innerHTML = `${len}バイト ${pill} <span>${note}</span>`;
  }
  wireLinks(update);
  $("maker").addEventListener("input", update);
  $("maker").addEventListener("change", update);
  $("maker").addEventListener("submit", e => e.preventDefault());
  update();

  $("m-copy").addEventListener("click", () => {
    const text = $("m-url").textContent;
    const done = () => { $("m-copy").textContent = "コピーしました"; setTimeout(() => $("m-copy").textContent = "URLをコピー", 1800); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("m-url")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("m-copy").textContent = "選択したのでコピーしてください"; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  });

  wireSearch(update);
}

/* Apple Musicのリンクから曲名などを取ってくる（iTunes Search API） */
/* 曲名やアーティスト名で、Apple Musicのカタログを検索して入れる（iTunes Search API） */
function wireSearch(update) {
  const $ = id => document.getElementById(id);
  const cleanTitle = t => (t || "").replace(/\s*[\(\[]?(\d{4} )?Remaster(ed)?( \d{4})?[\)\]]?\s*$/i, "").replace(/\s+-\s*$/, "");
  function search(px) {
    const q = $(px + "-q").value.trim();
    const hint = $(px + "-search-hint"), list = $(px + "-results");
    if (!q) { hint.textContent = "曲名やアーティスト名を入れてください。"; return; }
    hint.textContent = "探しています…";
    const cb = "itsearch_" + px + Date.now();
    const sc = document.createElement("script");
    const fail = () => { hint.textContent = "検索できませんでした。電波のいいところで試すか、下に手で入れてください。"; cleanup(); };
    const timer = setTimeout(fail, 8000);
    function cleanup() { clearTimeout(timer); delete window[cb]; sc.remove(); }
    window[cb] = data => {
      cleanup();
      const items = ((data && data.results) || []).filter(x => x.wrapperType === "track" && x.kind === "song").slice(0, 8);
      if (!items.length) { list.hidden = true; hint.textContent = "見つかりませんでした。言葉を変えて検索するか、下に手で入れてください。"; return; }
      hint.textContent = "この中から選んでください。";
      list.innerHTML = items.map((t, i) => `
        <li><button type="button" class="result" data-i="${i}">
          ${t.artworkUrl60 ? `<img src="${esc(t.artworkUrl60)}" alt="" width="44" height="44" loading="lazy">` : `<span class="noart"></span>`}
          <span class="rt"><b>${esc(t.trackName)}</b><small>${esc(t.artistName)}${t.releaseDate ? " · " + esc(t.releaseDate.slice(0, 4)) : ""}</small></span>
        </button></li>`).join("");
      list.hidden = false;
      list.querySelectorAll(".result").forEach(b => b.addEventListener("click", () => {
        const t = items[Number(b.dataset.i)];
        $(px + "-title").value = cleanTitle(t.trackName);
        $(px + "-artist").value = t.artistName || "";
        $(px + "-year").value = (t.releaseDate || "").slice(0, 4);
        if (t.primaryGenreName && !$(px + "-tag").value) $(px + "-tag").value = t.primaryGenreName;
        /* Apple Musicのボタン用に、その曲のリンクも入れておく */
        if (t.trackViewUrl) {
          const rows = [...document.querySelectorAll(`#${px}-links .link-row`)];
          const appleRow = rows.find(r => r.querySelector("select").value === "apple");
          if (appleRow) { if (!appleRow.querySelector("input").value) appleRow.querySelector("input").value = t.trackViewUrl; }
          else addLinkRow(px, "apple", t.trackViewUrl);
        }
        list.hidden = true;
        hint.textContent = `「${cleanTitle(t.trackName)}」を入れました。違っていたら下で直してください（年は別バージョンの年になることがあります）。`;
        update();
      }));
    };
    sc.src = `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&country=jp&lang=ja_jp&limit=10&callback=${cb}`;
    sc.onerror = fail;
    document.body.appendChild(sc);
  }
  document.querySelectorAll("[data-search]").forEach(btn => {
    const px = btn.dataset.search;
    btn.addEventListener("click", () => search(px));
    $(px + "-q").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); search(px); } });
  });
}
function wireFill(update) {
  const $ = id => document.getElementById(id);
  const cleanTitle = t => (t || "").replace(/\s*[\(\[]?(\d{4} )?Remaster(ed)?( \d{4})?[\)\]]?\s*$/i, "").replace(/\s+-\s*$/, "");
  function apply(px, r, hint) {
    if (r.title) $(px + "-title").value = cleanTitle(r.title);
    if (r.artist) $(px + "-artist").value = r.artist;
    if (r.year) $(px + "-year").value = r.year;
    if (r.genre && !$(px + "-tag").value) $(px + "-tag").value = r.genre;
    hint.textContent = r.year
      ? "入れました。違っていたら直してください（リリース年は別バージョンの年になることがあります）。"
      : "曲名とアーティストを入れました。リリース年は分からなかったので、わかれば入れてください。";
    update();
  }
  document.querySelectorAll("[data-fill]").forEach(btn => btn.addEventListener("click", async () => {
    const px = btn.dataset.fill, svc = btn.dataset.svc;
    const name = (MAKER_LINKS.find(([k]) => k === svc) || [])[1] || "";
    const url = readLinks(px)[svc] || "";
    const hint = $(px + "-fill-hint");
    const fail = () => { hint.textContent = "読み込めませんでした。曲名とアーティストを手で入れてください。"; };
    if (svc === "apple") {
      const id = LINK_IDS.apple.pack(url);
      if (!id) { hint.textContent = "Apple Musicの曲のリンクを入れてください（アルバムではなく、曲の「共有」から取ったリンク）。"; return; }
      hint.textContent = "読み込み中…";
      const cb = "itunes_" + px + Date.now();
      const sc = document.createElement("script");
      const timer = setTimeout(() => { fail(); cleanup(); }, 8000);
      function cleanup() { clearTimeout(timer); delete window[cb]; sc.remove(); }
      window[cb] = data => {
        cleanup();
        const list = (data && data.results) || [];
        const t = list.find(x => x.wrapperType === "track") || list[0];
        if (!t) { hint.textContent = "曲が見つかりませんでした。曲名とアーティストを手で入れてください。"; return; }
        apply(px, { title: t.trackName, artist: t.artistName, year: (t.releaseDate || "").slice(0, 4), genre: t.primaryGenreName }, hint);
      };
      sc.src = `https://itunes.apple.com/lookup?id=${id}&country=jp&lang=ja_jp&callback=${cb}`;
      sc.onerror = () => { fail(); cleanup(); };
      document.body.appendChild(sc);
      return;
    }
    if (!url || !LINK_IDS[svc].pack(url)) { hint.textContent = `${name}の曲のリンクを入れてください（「共有」→「リンクをコピー」で取ったもの）。`; return; }
    if (!API) { fail(); return; }
    hint.textContent = "読み込み中…";
    btn.disabled = true;
    try {
      const res = await fetch(`${API}?action=lookup&url=${encodeURIComponent(url)}`);
      const r = await res.json();
      if (r.ok && r.title) apply(px, r, hint);
      else if (r.error === "bad_action") hint.textContent = "まだこの機能が使えません。曲名とアーティストを手で入れてください。";
      else hint.textContent = "曲が見つかりませんでした。曲名とアーティストを手で入れてください。";
    } catch (e) { fail(); }
    btn.disabled = false;
  }));
}

/* ── 買った人が曲を登録できるキーホルダー（?id=xxxx） ──
   曲はGoogleスプレッドシートに保存します。下の API に、Apps Scriptの公開URLを入れてください。 */
const API = "https://script.google.com/macros/s/AKfycbxKIfdANfcUEqNsrrlVkWUPl6ts66QrrhngHf0nC1YFbBSS0B5kIK9Z12PP3TWTWKAe/exec";

async function api(payload) {
  const res = payload
    ? await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
    : null;
  return res.json();
}
async function apiGet(id) {
  const res = await fetch(`${API}?action=get&id=${encodeURIComponent(id)}`);
  return res.json();
}
const ERR = {
  wrong_code: "編集コードが違います。",
  locked: "間違いが続いたので、いったん受け付けを止めています。1時間ほどたってから試してください。",
  need_side_a: "SIDE Aの曲名とアーティストを入れてください。",
  not_found: "このキーホルダーが見つかりません。",
  network: "通信できませんでした。電波のいいところで、もう一度試してください。"
};
const msg = e => ERR[e] || ERR.network;
/* コードをなくしたときの連絡先 */
const IG = "strange_mise";
const IG_LINK = `<a href="https://www.instagram.com/${IG}/" target="_blank" rel="noopener">@${IG}</a>`;

function deckEmpty() { return deck("?", "No."); }

async function renderStore(out, id, keepSide) {
  if (!keepSide) currentSide = "A";
  if (!API) {
    out.innerHTML = `<div class="empty"><h1>準備中です</h1><p>このキーホルダーは、もうすぐ使えるようになります。</p></div>`;
    return;
  }
  out.innerHTML = `<div class="empty"><h1>レコードを探しています…</h1></div>`;
  let r;
  try { r = await apiGet(id); } catch (e) { r = { ok: false }; }
  if (!r.ok) {
    out.innerHTML = `<div class="empty"><h1>読み込めませんでした</h1><p>${ERR.network}</p><p><button type="button" class="btn2" id="retry">もう一度読み込む</button></p></div>`;
    document.getElementById("retry").onclick = () => renderStore(out, id);
    return;
  }
  if (!r.exists) {
    out.innerHTML = `<div class="empty"><h1>このキーホルダーは見つかりません</h1><p>URLが途中で切れているかもしれません。</p></div>`;
    return;
  }
  if (!r.a) {
    out.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:22px">
        ${deckEmpty()}
        <section class="maker">
          <h1>まだ何も録音されていません</h1>
          <p class="lead">このキーホルダーに、あなたの好きな曲を入れましょう。SIDE AとSIDE Bに1曲ずつ、2曲まで入れられます。</p>
          <button type="button" class="btn2" id="start">曲を入れる</button>
        </section>
      </div>`;
    document.getElementById("start").onclick = () => renderEditor(out, id, null, "");
    return;
  }
  const sides = { A: { song: r.a, kind: "mine" }, B: r.b ? { song: r.b, kind: "mine" } : null };
  renderSides(out, sides, `<button type="button" class="again" id="again">曲を入れ直す</button>`, () => {
    /* お店がコードを消した（リセットした）キーホルダーは、コードなしで入れ直せて、保存すると新しいコードが出る */
    document.getElementById("again").onclick = () => renderEditor(out, id, r, "");
  });
  fitTitle();
}

function renderUnlock(out, id, data) {
  out.innerHTML = `
    <form class="maker" id="unlock" novalidate>
      <h1>曲を入れ直す</h1>
      <p class="lead">最初に曲を入れたときに表示された、6桁の編集コードを入れてください。</p>
      <div class="field">
        <label for="code">編集コード</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="例：123456">
      </div>
      <p class="hint err" id="unlock-msg"></p>
      <div class="acts2">
        <button type="button" class="btn2 ghost" id="back">もどる</button>
        <button type="submit" class="btn2" id="go">次へ</button>
      </div>
      <p class="hint">コードをなくしたときは、Instagramの ${IG_LINK} にDMで連絡してください。キーホルダーをかざして開いたページのURLも一緒に送ってください。</p>
    </form>`;
  const $ = x => document.getElementById(x);
  $("back").onclick = () => renderStore(out, id);
  $("unlock").addEventListener("submit", async e => {
    e.preventDefault();
    const code = $("code").value.replace(/\D/g, "");
    if (code.length !== 6) { $("unlock-msg").textContent = "6桁の数字を入れてください。"; return; }
    $("go").disabled = true; $("go").textContent = "確認中…"; $("unlock-msg").textContent = "";
    let r;
    try { r = await api({ action: "check", id, code }); } catch (err) { r = { ok: false, error: "network" }; }
    if (r.ok) { renderEditor(out, id, data, code); return; }
    $("unlock-msg").textContent = msg(r.error);
    $("go").disabled = false; $("go").textContent = "次へ";
  });
}

function fillForm(px, song) {
  if (!song) return;
  const $ = x => document.getElementById(x);
  MAKER_FIELDS.forEach(([k]) => { if (song[k]) $(px + "-" + k).value = song[k]; });
  initLinks(px, song.links);
  /* Apple Music以外のリンクが入っていれば、たたんだ欄を開いておく */
  if (song.links && Object.keys(song.links).some(k => k !== "apple")) document.getElementById(px + "-more").open = true;
}
function readForm(px) {
  const $ = x => document.getElementById(x);
  const song = { links: {} };
  MAKER_FIELDS.forEach(([k]) => { const v = $(px + "-" + k).value.trim(); if (v) song[k] = v; });
  Object.assign(song.links, readLinks(px));
  return song.title && song.artist ? song : null;
}

function renderEditor(out, id, data, code) {
  out.innerHTML = `
    <form class="maker" id="editor" novalidate>
      <h1>${data && data.a ? "曲を入れ直す" : "このキーホルダーに曲を入れる"}</h1>
      <p class="lead">SIDE Aは必ず、SIDE Bは入れたいときだけ入れてください。</p>
      ${sideForm("a", "A", ["mine"])}
      ${sideForm("b", "B", ["none", "mine"])}
      <p class="hint err" id="ed-msg"></p>
      <div class="acts2">
        <button type="button" class="btn2 ghost" id="cancel">やめる</button>
        <button type="submit" class="btn2" id="save" disabled>保存する</button>
      </div>
    </form>`;
  const $ = x => document.getElementById(x);
  /* SIDE Aは「自分の曲」だけなので、選ぶボタンは出さない */
  document.querySelector('[data-px="a"] .modes').hidden = true;
  if (data && data.b) { document.querySelector('input[name="b-mode"][value="mine"]').checked = true; }
  wireLinks(() => update());
  fillForm("a", data && data.a);
  fillForm("b", data && data.b);
  const modeOf = px => document.querySelector(`input[name="${px}-mode"]:checked`).value;
  function update() {
    document.querySelectorAll("#editor .side-block").forEach(sec => {
      const m = modeOf(sec.dataset.px);
      sec.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.mode !== m);
    });
    const okA = !!readForm("a");
    const okB = modeOf("b") === "none" || !!readForm("b");
    $("save").disabled = !(okA && okB);
  }
  $("editor").addEventListener("input", update);
  $("editor").addEventListener("change", update);
  wireSearch(update);
  update();
  $("cancel").onclick = () => renderStore(out, id);
  $("editor").addEventListener("submit", async e => {
    e.preventDefault();
    if ($("save").disabled) return;
    $("save").disabled = true; $("save").textContent = "保存中…"; $("ed-msg").textContent = "";
    const payload = { action: "save", id, code, a: readForm("a"), b: modeOf("b") === "mine" ? readForm("b") : null };
    let r;
    try { r = await api(payload); } catch (err) { r = { ok: false, error: "network" }; }
    if (!r.ok) {
      $("ed-msg").textContent = msg(r.error);
      $("save").disabled = false; $("save").textContent = "保存する";
      return;
    }
    renderStore(out, id);
    scrollTo(0, 0);
  });
}

function renderCode(out, id, code) {
  out.innerHTML = `
    <section class="maker codebox">
      <h1>録音できました</h1>
      <p class="lead">これがあなたの<b>編集コード</b>です。あとで曲を入れ直すときに必要です。</p>
      <p class="code-big" id="code-text">${esc(code)}</p>

/* 曲名を1行に収める：はみ出すときだけ文字を小さくする */
function fitTitle() {
  const t = document.querySelector(".title");
  if (!t) return;
  t.style.fontSize = "";
  let size = parseFloat(getComputedStyle(t).fontSize);
  while (t.scrollWidth > t.clientWidth && size > 16) {
    size -= 1;
    t.style.fontSize = size + "px";
  }
}
function show() { render(); fitTitle(); scrollTo(0, 0); }
show();
addEventListener("hashchange", show);
addEventListener("resize", fitTitle);
if (document.fonts) document.fonts.ready.then(fitTitle);
